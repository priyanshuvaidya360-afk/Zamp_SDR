# What "we" sell. Relevance scoring, hook choice and drafting all read this file.
# The seller is fictional (see ASSUMPTIONS.md). It is chosen to fit the prospects we demo
# with: growth, marketing and sales leaders at B2B software companies.

company: Halyard
rep:
  name: Shivam Shukla
  title: Account Executive

offer: >
  Halyard is an outbound pipeline engine for B2B SaaS teams. It spots accounts showing
  buying signals, finds the right contacts, and drafts researched, cited first-touch emails
  that reps review before sending, so growth teams build pipeline without adding SDR
  headcount or blasting generic sequences.

problem_solved: >
  outbound pipeline that only grows by hiring more SDRs, while generic sequences get
  falling reply rates and burn through the target market

icp:
  industries: [B2B SaaS, developer tools, fintech software, martech, HR tech]
  company_size: 20-2,000 employees
  regions: [US, UK, EU, India, Australia]
  buyer_titles: [CMO, VP Marketing, Head of Growth, Head of Demand Generation, VP Sales,
                 Head of Sales Development, RevOps lead]
  triggers:
    - funding round (a board that now expects pipeline to grow fast)
    - hiring SDRs, BDRs, account executives or growth marketers
    - a new CMO, VP Marketing, VP Sales or Head of Growth
    - launching a new product, plan or market that needs pipeline from scratch
    - a product-led company adding a sales-led motion

# What the gather stage looks for in each prospect company's job posts.
hiring_focus: SDR BDR sales development account executive growth marketing

tone:
  voice: plain, specific, peer-to-peer; no hype
  max_words: 120
  banned_phrases:
    - "I hope this finds you well"
    - "I came across your profile"
    - "I wanted to reach out"
    - "quick question"
    - "synergy"

# Case 3: title patterns -> the angle each persona cares about.
personas:
  - match: [CMO, Chief Marketing Officer, VP Marketing, Vice President of Marketing]
    angle: pipeline targets and cost per opportunity
  - match: [Head of Growth, Growth, Demand Generation, Demand Gen]
    angle: channel performance and running more outbound experiments without more headcount
  - match: [VP Sales, Vice President of Sales, SVP Sales, Americas Sales, Head of Sales, Sales Development,
           SDR Manager, BDR]
    angle: rep productivity and meetings booked per rep
  - match: [RevOps, Revenue Operations, Sales Operations]
    angle: clean data and fewer tools to stitch together

# Case 3: staggered send days within one account (assumption).
send_order:
  - persona: Head of Growth
    day: 0
  - persona: VP Sales
    day: 2
  - persona: CMO
    day: 5

# Case 6: competitor signals.
competitors:
  - name: Apollo
    typical_contract_months: 12
    migration_story: >
      Teams keep Apollo's database but stop sending its generic sequences; Halyard writes
      the first touch from a real, cited signal and plugs into the same CRM.
  - name: Clay
    typical_contract_months: 12
    migration_story: null
  - name: 6sense
    typical_contract_months: 24
    migration_story: >
      6sense says which accounts are in market; Halyard turns that into a researched email a
      rep can send the same day, without a separate ops build.
  - name: ZoomInfo
    typical_contract_months: 12
    migration_story: null

# Case 12: country -> language and compliance handling.
regions:
  IN: {language: en, strict: false}
  US: {language: en, strict: false}
  GB: {language: en, strict: false}
  AU: {language: en, strict: false}
  DE: {language: de, strict: true, opt_out: "Sie können dem Erhalt weiterer E-Mails jederzeit widersprechen."}
