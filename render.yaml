# Render blueprint for the backend API (free plan). New > Blueprint > pick this repo.
# The frontend goes on Vercel (root directory: frontend). Steps in README.md, "Deploy".
services:
  - type: web
    name: signal-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Seeding the fake CRM data is idempotent, so it is safe on every start.
    startCommand: python -m scripts.seed_context && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DEMO_MODE
        value: live
      # Free Postgres: Neon or Supabase. Paste its connection string (postgres://... is fine).
      - key: DATABASE_URL
        sync: false
      # JSON list: your Vercel URL, e.g. ["https://signal-outreach.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
